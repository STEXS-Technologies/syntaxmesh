[package]
name = "syntaxmesh-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "syntaxmesh"
path = "src/main.rs"

[[test]]
name = "semantic_command"
path = "tests/semantic_command.rs"
harness = false

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
syntaxmesh-watch = { path = "../syntaxmesh-watch" }
syntaxmesh-watch-host = { path = "../syntaxmesh-watch-host" }
syntaxmesh-source-host = { path = "../syntaxmesh-source-host" }
syntaxmesh-ownership-host = { path = "../syntaxmesh-ownership-host" }
hex.workspace = true
blake3.workspace = true
reqwest = { workspace = true, features = ["query"] }
url.workspace = true
httpdate.workspace = true
syntaxmesh-api-model.workspace = true
syntaxmesh-core.workspace = true
syntaxmesh-engine.workspace = true
syntaxmesh-extension-ipc = { path = "../syntaxmesh-extension-ipc" }
syntaxmesh-extension-sdk.workspace = true
syntaxmesh-lang-rust.workspace = true
syntaxmesh-lang-python.workspace = true
syntaxmesh-lang-ecmascript.workspace = true
syntaxmesh-lang-bash.workspace = true
syntaxmesh-lang-docs.workspace = true
syntaxmesh-language-sdk.workspace = true
syntaxmesh-query.workspace = true
syntaxmesh-resolver.workspace = true
syntaxmesh-scanner.workspace = true
syntaxmesh-semantic.workspace = true
syntaxmesh-store.workspace = true
syntaxmesh-store-sqlite.workspace = true
syntaxmesh-store-turso.workspace = true
oxc_resolver.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
axum.workspace = true
syntaxmesh-http = { path = "../syntaxmesh-http" }
tokio.workspace = true
blake3.workspace = true
syntaxmesh-integration-penelope.workspace = true
syntaxmesh-runtime-protocol.workspace = true
syntaxmesh-workflow.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }
