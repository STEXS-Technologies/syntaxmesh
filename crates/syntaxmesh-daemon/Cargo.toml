[package]
name = "syntaxmesh-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared-owner SyntaxMesh daemon host"

[features]
inference-sqlite = [
    "dep:serde",
    "dep:serde_json",
    "dep:syntaxmesh-api-model",
    "dep:syntaxmesh-core",
    "dep:syntaxmesh-inference-host",
    "dep:syntaxmesh-inference-sqlite",
    "syntaxmesh-http/inference-sqlite",
    "syntaxmesh-mcp/inference-sqlite",
]

[[bin]]
name = "syntaxmeshd"
path = "src/main.rs"

[dependencies]
syntaxmesh-engine.workspace = true
syntaxmesh-query.workspace = true
axum.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
syntaxmesh-api-model = { workspace = true, optional = true }
syntaxmesh-core = { workspace = true, optional = true }
syntaxmesh-inference-host = { workspace = true, optional = true }
syntaxmesh-inference-sqlite = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
syntaxmesh-mcp = { path = "../syntaxmesh-mcp" }
ctrlc = { version = "3.5.2", features = ["termination"] }
syntaxmesh-http = { path = "../syntaxmesh-http" }
syntaxmesh-ownership-host = { path = "../syntaxmesh-ownership-host" }
syntaxmesh-source-host = { path = "../syntaxmesh-source-host" }
syntaxmesh-watch-host = { path = "../syntaxmesh-watch-host" }
syntaxmesh-scanner.workspace = true
syntaxmesh-store-turso.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }

[dev-dependencies]
syntaxmesh-api-model.workspace = true
syntaxmesh-core.workspace = true
syntaxmesh-inference.workspace = true
syntaxmesh-store.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { workspace = true, features = ["query"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }
